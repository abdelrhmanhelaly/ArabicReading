<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الحروف والكلمات العربية</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #1f2937;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    /* نافذة البدء لفك حظر الصوت */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
      text-align: center;
    }
    #startOverlay button {
      background: #16a34a;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 16px 32px;
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.35);
      cursor: pointer;
    }
    .level-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      width: 100%;
    }
    .level-btn {
      flex: 1;
      padding: 10px 5px;
      border: 2px solid #22c55e;
      background: #f0fdf4;
      color: #15803d;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .level-btn.active {
      background: #22c55e;
      color: white;
    }
    .display-area {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      text-align: center;
    }
    .target-char {
      font-size: 64px;
      font-weight: bold;
      color: #16a34a;
      line-height: 1;
    }
    .target-image {
      font-size: 60px;
      line-height: 1.1;
    }
    .progress-word {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      direction: rtl;
    }
    .slot {
      width: 40px;
      height: 46px;
      border: 2px dashed #9ca3af;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #15803d;
      background: #f9fafb;
    }
    .slot.filled {
      border-style: solid;
      border-color: #22c55e;
      background: #dcfce7;
    }
    .sound-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
    }
    .sound-btn:active {
      transform: scale(0.92);
    }
    /* شبكة 5 في 6 محكمة */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 380px;
    }
    .letter-cell {
      aspect-ratio: 1;
      background: #f3f4f6;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      color: #1f2937;
      transition: transform 0.1s, background-color 0.15s;
    }
    .letter-cell:active {
      transform: scale(0.92);
    }
    .shake {
      animation: shake 0.35s ease-in-out;
      background-color: #fecaca !important;
      border-color: #ef4444 !important;
    }
    .pop {
      background-color: #bbf7d0 !important;
      border-color: #22c55e !important;
      transform: scale(1.08);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .feedback {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      min-height: 22px;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="startOverlay">
    <h2 style="margin-bottom: 15px; color:#15803d;">مرحباً بك في لعبة الحروف! 🎈</h2>
    <p style="color:#6b7280; font-size:14px; margin-bottom:20px;">اضغط على الزر لتفعيل الصوت والبدء</p>
    <button onclick="startGame()">ابدأ اللعب الآن 🔊</button>
  </div>

  <div class="level-bar">
    <button class="level-btn active" onclick="setLevel(1)">المستوى 1 (الحرف)</button>
    <button class="level-btn" onclick="setLevel(2)">المستوى 2 (الحيوان)</button>
    <button class="level-btn" onclick="setLevel(3)">المستوى 3 (الكلمة)</button>
  </div>

  <div class="display-area" id="displayArea"></div>

  <button class="sound-btn" onclick="repeatSound()" title="إعادة تشغيل الصوت">🔊</button>

  <div class="grid" id="lettersGrid"></div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
  // جدول 30 خانة يحتوي على التاء المربوطة والهمزة وجميع الحروف
  const ARABIC_LETTERS = [
    { char: 'أ', name: 'ألف' },
    { char: 'ب', name: 'باء' },
    { char: 'ت', name: 'تاء' },
    { char: 'ث', name: 'ثاء' },
    { char: 'ج', name: 'جيم' },
    { char: 'ح', name: 'حاء' },
    { char: 'خ', name: 'خاء' },
    { char: 'د', name: 'دال' },
    { char: 'ذ', name: 'ذال' },
    { char: 'ر', name: 'راء' },
    { char: 'ز', name: 'زاي' },
    { char: 'س', name: 'سين' },
    { char: 'ش', name: 'شين' },
    { char: 'ص', name: 'صاد' },
    { char: 'ض', name: 'ضاد' },
    { char: 'ط', name: 'طاء' },
    { char: 'ظ', name: 'ظاء' },
    { char: 'ع', name: 'عين' },
    { char: 'غ', name: 'غين' },
    { char: 'ف', name: 'فاء' },
    { char: 'ق', name: 'قاف' },
    { char: 'ك', name: 'كاف' },
    { char: 'ل', name: 'لام' },
    { char: 'م', name: 'ميم' },
    { char: 'ن', name: 'نون' },
    { char: 'هـ', name: 'هاء' },
    { char: 'و', name: 'واو' },
    { char: 'ي', name: 'ياء' },
    { char: 'ة', name: 'تاء مربوطة' },
    { char: 'ء', name: 'همزة' }
  ];

  const ANIMALS = [
    { word: 'أسد', icon: '🦁' },
    { word: 'أرنب', icon: '🐰' },
    { word: 'جمل', icon: '🐪' },
    { word: 'حصان', icon: '🐎' },
    { word: 'فيل', icon: '🐘' },
    { word: 'نمر', icon: '🐅' },
    { word: 'قرد', icon: '🐒' },
    { word: 'دب', icon: '🐻' },
    { word: 'بطة', icon: '🦆' },
    { word: 'صقر', icon: '🦅' }
  ];

  const OBJECTS = ['كتاب', 'غلاف', 'شنطة', 'قلم', 'علبة', 'مفتاح', 'باب', 'كرسي', 'علم', 'دفتر'];

  let currentLevel = 1;
  let targetLetter = '';
  let targetWord = '';
  let currentWordProgress = [];
  let currentVoiceText = '';

  // 1. نظام نغمات تفاعلية مدمج يعزف من داخل الهاتف والكمبيوتر بدون أي إنترنت
  let audioCtx = null;

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(type) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'success') {
        // نغمة نجاح ثلاثية مبهجة
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'error') {
        // نغمة خطأ منخفضة وواضحة
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.setValueAtTime(130, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    } catch(e) {}
  }

  // 2. نظام نطق الكلمات والحروف المباشر
  function speakVoice(text) {
    if (!('speechSynthesis' in window) || !text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      u.rate = 0.85;

      // محاولة اختيار أفضل صوت عربي متاح
      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang && (v.lang.startsWith('ar') || v.lang.includes('ar')));
      if (arVoice) u.voice = arVoice;

      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  function playSoundAndVoice(text, soundType) {
    currentVoiceText = text;
    if (soundType) playTone(soundType);
    speakVoice(text);
  }

  function repeatSound() {
    playSoundAndVoice(currentVoiceText);
  }

  function startGame() {
    initAudioContext();
    document.getElementById('startOverlay').style.display = 'none';

    // تنشيط محرك الصوت بكلمة افتتاحية
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      const dummy = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(dummy);
    }
    nextQuestion();
  }

  // رسم جدول الـ 30 خانة (5 أعمدة في 6 صفوف)
  function createGrid() {
    const grid = document.getElementById('lettersGrid');
    grid.innerHTML = '';
    
    ARABIC_LETTERS.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'letter-cell';
      cell.innerText = item.char;
      cell.onclick = () => handleLetterClick(item.char, cell);
      grid.appendChild(cell);
    });
  }

  function setLevel(lvl) {
    currentLevel = lvl;
    document.querySelectorAll('.level-btn').forEach((btn, index) => {
      btn.classList.toggle('active', index + 1 === lvl);
    });
    nextQuestion();
  }

  function nextQuestion() {
    document.getElementById('feedback').innerText = '';
    const displayArea = document.getElementById('displayArea');

    if (currentLevel === 1) {
      const randomItem = ARABIC_LETTERS[Math.floor(Math.random() * ARABIC_LETTERS.length)];
      targetLetter = randomItem.char;
      displayArea.innerHTML = `<div class="target-char">${targetLetter}</div>`;
      playSoundAndVoice(randomItem.name);
    } 
    else if (currentLevel === 2) {
      const randomAnimal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
      targetWord = randomAnimal.word;
      currentWordProgress = [];

      let slotsHtml = `<div class="target-image">${randomAnimal.icon}</div><div class="progress-word">`;
      for (let i = 0; i < targetWord.length; i++) {
        slotsHtml += `<div class="slot" id="slot-${i}"></div>`;
      }
      slotsHtml += `</div>`;
      displayArea.innerHTML = slotsHtml;
      playSoundAndVoice(targetWord);
    } 
    else if (currentLevel === 3) {
      targetWord = OBJECTS[Math.floor(Math.random() * OBJECTS.length)];
      currentWordProgress = [];

      let slotsHtml = `<div style="font-size: 19px; color: #4b5563; font-weight: bold;">استمع للكلمة ورتّب حروفها</div><div class="progress-word">`;
      for (let i = 0; i < targetWord.length; i++) {
        slotsHtml += `<div class="slot" id="slot-${i}"></div>`;
      }
      slotsHtml += `</div>`;
      displayArea.innerHTML = slotsHtml;
      playSoundAndVoice(targetWord);
    }
  }

  // تسوية ذكية للحروف العربية: الهمزات والتاء المربوطة والهاء
  function normalizeArabic(ch) {
    return ch
      .replace(/[أإآء]/g, 'ا')
      .replace(/[ةه]/g, 'هـ')
      .replace(/ى/g, 'ي');
  }

  function handleLetterClick(letter, cellEl) {
    if (currentLevel === 1) {
      const isMatch = (letter === targetLetter) || (normalizeArabic(letter) === normalizeArabic(targetLetter));
      if (isMatch) {
        showSuccess(cellEl);
        playTone('success');
        setTimeout(nextQuestion, 1000);
      } else {
        showError(cellEl);
        playSoundAndVoice(currentVoiceText, 'error');
      }
    } else {
      const expectedChar = targetWord[currentWordProgress.length];
      const isMatch = (letter === expectedChar) || (normalizeArabic(letter) === normalizeArabic(expectedChar));

      if (isMatch) {
        cellEl.classList.add('pop');
        playTone('success');
        setTimeout(() => cellEl.classList.remove('pop'), 200);

        const slot = document.getElementById(`slot-${currentWordProgress.length}`);
        slot.innerText = letter;
        slot.classList.add('filled');
        currentWordProgress.push(letter);

        if (currentWordProgress.length === targetWord.length) {
          document.getElementById('feedback').innerText = 'ممتاز! إجابة صحيحة 🎉';
          document.getElementById('feedback').style.color = '#16a34a';
          setTimeout(nextQuestion, 1300);
        }
      } else {
        showError(cellEl);
        playSoundAndVoice(currentVoiceText, 'error');
      }
    }
  }

  function showError(cellEl) {
    cellEl.classList.add('shake');
    document.getElementById('feedback').innerText = 'حاول مرة أخرى!';
    document.getElementById('feedback').style.color = '#dc2626';
    setTimeout(() => cellEl.classList.remove('shake'), 400);
  }

  function showSuccess(cellEl) {
    cellEl.classList.add('pop');
    document.getElementById('feedback').innerText = 'أحسنت! إجابة صحيحة 🎉';
    document.getElementById('feedback').style.color = '#16a34a';
    setTimeout(() => cellEl.classList.remove('pop'), 400);
  }

  createGrid();
</script>

</body>
</html>
